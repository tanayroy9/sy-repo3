# Codemagic cloud build for the iPhone/iPad app (no Mac needed).
# Setup: Codemagic > Teams > Integrations > App Store Connect API key named "Serviceydere ASC".
workflows:
  ios-release:
    name: iOS – App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Serviceydere ASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: dk.serviceydere.app
      node: 22
      xcode: latest
      vars:
        CAP_RELEASE: "1"
        APP_STORE_APPLE_ID: "6831961372"
    scripts:
      - name: Install dependencies
        script: npm ci || npm install
      - name: Build web and sync Capacitor
        script: npm run app:release
      - name: Set build number
        script: |
          cd ios/App
          agvtool new-version -all $(($(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0) + 1)) || agvtool new-version -all $BUILD_NUMBER
      - name: Signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - william@serviceydere.dk
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-apk:
    name: Android – installérbar app (APK)
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      node: 20
      java: 21
      vars:
        CAP_RELEASE: "1"
    scripts:
      - name: Install dependencies
        script: npm ci || npm install
      - name: Build web and sync Capacitor
        script: npm run build && npx cap sync android
      - name: Build APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - william@serviceydere.dk
        notify:
          success: true
          failure: true
